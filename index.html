<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄专注</title>
<style>
:root{
  --bg:#f6f4f1;--card:#ffffff;--text:#23201d;--muted:#8a847d;--line:#ebe6e0;
  --accent:#e8594a;--accent-soft:#fde7e3;--track:#f1ece6;--shadow:0 10px 30px rgba(60,40,20,.08);
}
[data-theme="dark"]{
  --bg:#15161a;--card:#1f2026;--text:#ecebe8;--muted:#8f8f99;--line:#2c2d35;
  --accent-soft:#3a2522;--track:#2a2b33;--shadow:0 10px 30px rgba(0,0,0,.35);
}
body[data-mode="short"]{--accent:#2fa37a;--accent-soft:#dff3ea}
body[data-mode="long"]{--accent:#4a7de8;--accent-soft:#e2eafd}
[data-theme="dark"] body[data-mode="short"]{--accent-soft:#1c3229}
[data-theme="dark"] body[data-mode="long"]{--accent-soft:#1f2740}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.logo .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:16px;transition:background .3s}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 14px;cursor:pointer;font-size:14px;font-family:inherit}
.icon-btn:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:28px;transition:background .3s}
.modes{display:flex;gap:6px;background:var(--track);padding:5px;border-radius:14px;width:fit-content;margin:0 auto 26px}
.modes button{border:0;background:transparent;color:var(--muted);padding:9px 18px;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
.modes button.active{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ring-box{position:relative;width:320px;height:320px;margin:0 auto}
.ring-box svg{transform:rotate(-90deg)}
.ring-track{stroke:var(--track)}
.ring-prog{stroke:var(--accent);transition:stroke-dashoffset .5s linear,stroke .3s;stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font-size:68px;font-weight:300;letter-spacing:2px;font-variant-numeric:tabular-nums}
.status{color:var(--muted);font-size:14px;margin-top:4px}
.current{margin:22px auto 0;text-align:center;font-size:15px;color:var(--muted);min-height:22px}
.current b{color:var(--text)}
.controls{display:flex;justify-content:center;gap:14px;margin-top:22px}
.btn{border:0;border-radius:14px;padding:13px 34px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:600;transition:transform .1s,background .3s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;min-width:140px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.side{display:flex;flex-direction:column;gap:24px}
h2{font-size:17px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--accent-soft);border-radius:16px;padding:16px;transition:background .3s}
.stat .num{font-size:30px;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:13px;color:var(--muted);margin-top:2px}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none}
.add input:focus{border-color:var(--accent)}
.add button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;font-size:15px;cursor:pointer;font-family:inherit}
ul{list-style:none;max-height:300px;overflow:auto}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:background .15s}
li:hover{background:var(--track)}
li.sel{border-color:var(--accent);background:var(--accent-soft)}
li .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:#fff;font-size:12px}
li.done .chk{background:var(--accent);border-color:var(--accent)}
li .txt{flex:1;font-size:15px;word-break:break-all}
li.done .txt{text-decoration:line-through;color:var(--muted)}
li .cnt{font-size:12px;color:var(--muted)}
li .del{opacity:0;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
li:hover .del{opacity:1}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:20px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body data-mode="focus">
<div class="wrap">
  <header>
    <div class="logo"><span class="dot">🍅</span>番茄专注</div>
    <button class="icon-btn" id="themeBtn">🌙 深色</button>
  </header>
  <div class="grid">
    <section class="card">
      <div class="modes" id="modes">
        <button data-mode="focus" class="active">专注 25 分钟</button>
        <button data-mode="short">短休息 5 分钟</button>
        <button data-mode="long">长休息 15 分钟</button>
      </div>
      <div class="ring-box">
        <svg width="320" height="320" viewBox="0 0 320 320">
          <circle class="ring-track" cx="160" cy="160" r="145" fill="none" stroke-width="14"/>
          <circle class="ring-prog" id="ring" cx="160" cy="160" r="145" fill="none" stroke-width="14"/>
        </svg>
        <div class="ring-center">
          <div class="time" id="time">25:00</div>
          <div class="status" id="status">准备开始专注</div>
        </div>
      </div>
      <div class="current" id="current">还没有选择任务</div>
      <div class="controls">
        <button class="btn primary" id="startBtn">开始</button>
        <button class="btn ghost" id="resetBtn">重置</button>
      </div>
    </section>
    <div class="side">
      <section class="card">
        <h2>今日统计 <small id="today"></small></h2>
        <div class="stats">
          <div class="stat"><div class="num" id="sPomo">0</div><div class="lbl">完成番茄数</div></div>
          <div class="stat"><div class="num" id="sMin">0</div><div class="lbl">专注分钟</div></div>
        </div>
      </section>
      <section class="card">
        <h2>任务清单 <small id="taskCount"></small></h2>
        <form class="add" id="addForm">
          <input id="taskInput" placeholder="添加一个任务，按回车确认" maxlength="80" autocomplete="off">
          <button type="submit">添加</button>
        </form>
        <ul id="list"></ul>
      </section>
    </div>
  </div>
  <footer>每完成 4 个番茄后建议长休息一次 · 点击任务设为当前任务</footer>
</div>
<script>
(function(){
const MODES={focus:{min:25,name:'专注'},short:{min:5,name:'短休息'},long:{min:15,name:'长休息'}};
const KEY='pomodoro-v1';
const $=id=>document.getElementById(id);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
let st={theme:'light',tasks:[],currentId:null,stats:{date:todayStr(),pomos:0,minutes:0},cycle:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)st=Object.assign(st,s);}catch(e){}
if(st.stats.date!==todayStr())st.stats={date:todayStr(),pomos:0,minutes:0};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};

let mode='focus',total=MODES.focus.min*60,remain=total,running=false,endAt=0,tick=null;
const ring=$('ring'),C=2*Math.PI*145;
ring.style.strokeDasharray=C;

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function render(){
  $('time').textContent=fmt(remain);
  ring.style.strokeDashoffset=C*(1-remain/total);
  $('startBtn').textContent=running?'暂停':(remain<total?'继续':'开始');
  $('status').textContent=running?(MODES[mode].name+'中…'):(remain<total?'已暂停':'准备开始'+MODES[mode].name);
  document.title=(running||remain<total)?fmt(remain)+' · '+MODES[mode].name+' - 番茄专注':'番茄专注';
  const cur=st.tasks.find(t=>t.id===st.currentId);
  $('current').innerHTML=cur?'当前任务：<b></b>':'还没有选择任务';
  if(cur)$('current').querySelector('b').textContent=cur.text;
}
function renderStats(){
  $('sPomo').textContent=st.stats.pomos;$('sMin').textContent=st.stats.minutes;
  const d=new Date();$('today').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function renderTasks(){
  const ul=$('list');ul.innerHTML='';
  if(!st.tasks.length){ul.innerHTML='<div class="empty">还没有任务，先添加一个吧 ✍️</div>';}
  st.tasks.forEach(t=>{
    const li=document.createElement('li');
    li.className=(t.done?'done ':'')+(t.id===st.currentId?'sel':'');
    li.innerHTML='<span class="chk">'+(t.done?'✓':'')+'</span><span class="txt"></span><span class="cnt"></span><button class="del" title="删除">×</button>';
    li.querySelector('.txt').textContent=t.text;
    li.querySelector('.cnt').textContent=t.pomos?('🍅×'+t.pomos):'';
    li.querySelector('.chk').onclick=e=>{e.stopPropagation();t.done=!t.done;if(t.done&&st.currentId===t.id)st.currentId=null;save();renderTasks();render();};
    li.querySelector('.del').onclick=e=>{e.stopPropagation();st.tasks=st.tasks.filter(x=>x.id!==t.id);if(st.currentId===t.id)st.currentId=null;save();renderTasks();render();};
    li.onclick=()=>{if(t.done)return;st.currentId=st.currentId===t.id?null:t.id;save();renderTasks();render();};
    ul.appendChild(li);
  });
  const left=st.tasks.filter(t=>!t.done).length;
  $('taskCount').textContent=st.tasks.length?('剩余 '+left+' / 共 '+st.tasks.length):'';
}
function setMode(m){
  mode=m;pause();total=MODES[m].min*60;remain=total;document.body.dataset.mode=m;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  render();
}
function start(){
  if(running)return;running=true;endAt=Date.now()+remain*1000;
  tick=setInterval(()=>{remain=Math.max(0,Math.round((endAt-Date.now())/1000));if(remain<=0)finish();else render();},250);
  render();
}
function pause(){running=false;clearInterval(tick);render();}
function finish(){
  pause();chime();
  if(st.stats.date!==todayStr())st.stats={date:todayStr(),pomos:0,minutes:0};
  let next;
  if(mode==='focus'){
    st.stats.pomos++;st.stats.minutes+=MODES.focus.min;st.cycle=(st.cycle||0)+1;
    const cur=st.tasks.find(t=>t.id===st.currentId);if(cur)cur.pomos=(cur.pomos||0)+1;
    next=st.cycle%4===0?'long':'short';
  }else next='focus';
  save();renderStats();renderTasks();
  setMode(next);
  $('status').textContent=next==='focus'?'休息结束，继续专注吧':'太棒了！休息一下吧';
  if(window.Notification&&Notification.permission==='granted'){try{new Notification('番茄专注',{body:next==='focus'?'休息结束，开始专注':'专注完成，休息一下'});}catch(e){}}
}
let actx=null;
function chime(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    [[659.25,0],[880,0.18],[1046.5,0.36]].forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(0.18,t0+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d+1.4);
      o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+1.5);
    });
  }catch(e){}
}
function applyTheme(){
  document.documentElement.dataset.theme=st.theme;
  $('themeBtn').textContent=st.theme==='dark'?'☀️ 浅色':'🌙 深色';
}
$('startBtn').onclick=()=>{
  if(actx&&actx.state==='suspended')actx.resume();
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(window.Notification&&Notification.permission==='default'){try{Notification.requestPermission();}catch(e){}}
  running?pause():start();
};
$('resetBtn').onclick=()=>{pause();remain=total;render();};
$('modes').onclick=e=>{const b=e.target.closest('button');if(b){if(running&&!confirm('计时进行中，确定切换模式吗？'))return;setMode(b.dataset.mode);}};
$('themeBtn').onclick=()=>{st.theme=st.theme==='dark'?'light':'dark';save();applyTheme();};
$('addForm').onsubmit=e=>{
  e.preventDefault();const v=$('taskInput').value.trim();if(!v)return;
  const t={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:v,done:false,pomos:0};
  st.tasks.push(t);if(!st.currentId)st.currentId=t.id;$('taskInput').value='';save();renderTasks();render();
};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();$('startBtn').click();}});
applyTheme();renderStats();renderTasks();render();
})();
</script>
</body>
</html>
